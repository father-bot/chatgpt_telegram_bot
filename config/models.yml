available_text_models: ["gpt-6-luna", "openai/gpt-5.5", "anthropic/claude-opus-4.8", "anthropic/claude-sonnet-latest", "anthropic/claude-haiku-latest"]

info:
  gpt-6-luna:
    type: chat_completion
    vision: true
    name: GPT-6 Luna
    description: GPT-6 Luna is OpenAI's <b>fast</b> and <b>affordable</b> model with image understanding. It replaces GPT-4o and GPT-4o mini, which OpenAI shuts down on 14 Jan 2027.
    # reasoning model: "none" keeps replies as quick and cheap as gpt-4o-mini
    # (the API default is "medium") and allows temperature
    reasoning_effort: "none"

    price_per_1000_input_tokens: 0.0001
    price_per_1000_output_tokens: 0.0005

    scores:
      Smart: 4
      Fast: 5
      Cheap: 5

